<!DOCTYPE html>
<html>
  <head>
    <title>Register</title>
  </head>

  <body>
    <h2>User Register</h2>

    <script>
      function registerUser(){
        alert("Registered successfully!");
      }

    <div>

    </div>
    
  </body>
</html>
